databases:
  - name: cipherchat-db
    databaseName: cipherchat
    user: cipherchat
    plan: free

services:
  - type: web
    name: cipherchat-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --include=dev && npx prisma db push && npm run build:server
    startCommand: npm run start:server
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cipherchat-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: http://localhost:3000,https://*.netlify.app
